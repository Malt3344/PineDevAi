      - generic [ref=e256]:
        - heading "What gets measured" [level=2] [ref=e257]
        - heading "The tests a fund would run, on your TradingView trades" [level=2] [ref=e258]
        - paragraph [ref=e259]: Export the list of trades from TradingView's Strategy Tester and upload it. Every number is computed from your trades, and every formula is documented.
        - generic [ref=e260]:
          - generic [ref=e261]:
            - generic [ref=e262]: Pre-registration
            - paragraph [ref=e268]: Hypothesis, data split and pass criteria are locked before the first backtest. Amending is allowed — and counted.
          - generic [ref=e269]:
            - generic [ref=e270]: Deflated Sharpe ratio
            - paragraph [ref=e275]: The probability your Sharpe beats the best of N strategies with no edge, where N is every variant you uploaded. Re-running makes it harder, not easier.
          - generic [ref=e276]:
            - generic [ref=e277]: Monte Carlo drawdown
            - paragraph [ref=e286]: Thousands of bootstrapped trade histories give the drawdown you should plan for, and the odds of hitting your own pain limit.
          - generic [ref=e287]:
            - generic [ref=e288]: Cost and outlier stress
            - paragraph [ref=e295]: The same trades at double and triple costs, and with the best 5% removed. Real edges survive both.
          - generic [ref=e296]:
            - generic [ref=e297]: One-shot out-of-sample
            - paragraph [ref=e307]: Held-out data, opened once. Efficiency against in-sample, and drawdown against the simulated band. A second look is recorded.
          - generic [ref=e308]:
            - generic [ref=e309]: Pine v6, built for testing
            - paragraph [ref=e317]: The research assistant writes the strategy with costs, a date window and no lookahead, then lints it for the ways backtests lie.
      - generic [ref=e319]:
        - generic [ref=e320]:
          - heading "Research assistant" [level=2] [ref=e321]
          - heading "An AI that argues with you, not one that agrees" [level=2] [ref=e322]
          - paragraph [ref=e323]: The assistant sits in every study and sees its hypothesis and results. It sharpens a vague idea into testable rules, writes the Pine v6 with the protocol scaffold, and explains each statistic with your own numbers. It will also tell you when a strategy is not worth trading — and it will not help you tune on the sealed data.
        - generic [ref=e324]:
          - generic [ref=e325]: The OOS profit factor was 0.9. If I change the stop to 1.5 ATR it's 1.4 — can we use that?
          - paragraph [ref=e330]: No — that 1.4 was found by looking at the out-of-sample data, so it is now in-sample. The honest result is the 0.9. If you believe the wider stop is better for a reason you can state, amend the hypothesis and test it on fresh data; it will count as another trial.
