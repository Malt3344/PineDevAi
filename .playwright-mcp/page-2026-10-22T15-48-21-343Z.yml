      - generic [ref=e183]:
        - heading "The problem" [level=2] [ref=e184]
        - heading "Why a good backtest loses money live" [level=2] [ref=e185]
        - generic [ref=e186]:
          - generic [ref=e187]:
            - generic [ref=e188]: You tried 40 versions
            - paragraph [ref=e194]: Tweak the RSI length, the stop, the session filter, and one combination will look great on any data — including random data. A backtest never tells you how many attempts it took.
          - generic [ref=e195]:
            - generic [ref=e196]: The drawdown was lucky
            - paragraph [ref=e205]: Your backtest's worst stretch is one ordering of the trades. Reshuffle them and the drawdown is often twice as deep. That is the one you will size into.
          - generic [ref=e206]:
            - generic [ref=e207]: The fills were free
            - paragraph [ref=e213]: A thin edge disappears the moment slippage is realistic. If doubling costs turns the equity curve red, the edge was never wider than the spread.
      - generic [ref=e215]:
        - heading "The protocol" [level=2] [ref=e216]
        - heading "Seven stages, in order, no skipping" [level=2] [ref=e217]
        - paragraph [ref=e218]: "Each stage unlocks the next. The order is the discipline: you commit to what you believe before the data can talk you into something else."
        - list [ref=e219]:
          - listitem [ref=e220]:
            - generic [ref=e221]: "01"
            - generic [ref=e222]:
              - heading "Hypothesis" [level=3] [ref=e223]
              - paragraph [ref=e224]: Pre-register the edge and the pass criteria before seeing any results.
          - listitem [ref=e225]:
